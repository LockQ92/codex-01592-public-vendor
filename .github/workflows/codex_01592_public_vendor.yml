# Public upstream-only Cargo dependency acquisition workflow.
# MANUAL DISPATCH ONLY. No private projects, modified sources or credentials.
name: Codex Rust 0.159.2 public dependency vendor (manual)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type APPROVE_PUBLIC_CODEX_VENDOR to enable the job'
        required: true
        type: string
        default: 'NOT_APPROVED'
      publish_artifact:
        description: 'Upload public-source vendor archive (subject to account budget)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codex-01592-public-vendor
  cancel-in-progress: false

jobs:
  public_vendor:
    if: ${{ inputs.approval == 'APPROVE_PUBLIC_CODEX_VENDOR' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout only public Codex upstream at pinned commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openai/codex
          ref: ff6aec96948b70d94983af2641a6b67c94faeff5
          fetch-depth: 1
          persist-credentials: false
          path: upstream

      - name: Verify commit, Cargo.lock and external source allowlist
        shell: bash
        run: |
          set -euo pipefail
          commit='ff6aec96948b70d94983af2641a6b67c94faeff5'
          actual="$(git -C upstream rev-parse HEAD)"
          test "$actual" = "$commit" || { echo 'STOP: upstream commit mismatch' >&2; exit 1; }
          python3 - <<'PY'
          import hashlib, os, pathlib, tomllib, urllib.parse
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'upstream/codex-rs'
          path = root / 'Cargo.lock'
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = '4fab6fe99180e2b8f305bd4b33c1b4bd825e3fa4cdef1045be750843bd3d431e'
          assert digest == expected, f'STOP: Cargo.lock changed ({digest})'
          toolchain = tomllib.loads((root / 'rust-toolchain.toml').read_text())
          assert toolchain['toolchain']['channel'] == '1.95.0'
          packages = tomllib.loads(path.read_text())['package']
          registry = [p for p in packages if p.get('source', '').startswith('registry+')]
          git = [p for p in packages if p.get('source', '').startswith('git+')]
          assert len(registry) == 1297, len(registry)
          assert len(git) == 16, len(git)
          assert all(len(p.get('checksum','')) == 64 for p in registry)
          allowed = {
              'microsoft/mxc',
              'openai-oss-forks/crossterm',
              'hyperium/h3',
              'helix-editor/nucleo.git',
              'dzbarsky/rules_rust',
              'openai-oss-forks/tokio-tungstenite',
              'openai-oss-forks/tungstenite-rs',
          }
          revisions = set()
          for p in git:
              s = p['source'][len('git+'):]
              url, sep, fragment = s.partition('#')
              assert sep and len(fragment) == 40, f'STOP: Git commit not pinned for {p["name"]}'
              u = urllib.parse.urlsplit(url)
              assert u.scheme == 'https' and u.netloc == 'github.com'
              assert u.path.lstrip('/') in allowed, f'STOP: unapproved Git repo: {u.path}'
              rev = urllib.parse.parse_qs(u.query).get('rev', [])
              assert rev == [fragment], f'STOP: Git revision mismatch for {p["name"]}'
              revisions.add(u.path.lstrip('/'))
          assert revisions == allowed, f'STOP: expected 7 repos; found {revisions}'
          print('PUBLIC_SOURCE_PREFLIGHT=PASS')
          print('CARGO_LOCK_SHA256=' + digest)
          print('REGISTRY_PACKAGES=1297 GIT_PACKAGES=16 GIT_REPOSITORIES=7')
          PY

      - name: Install exact public Rust toolchain in ephemeral runner only
        shell: bash
        env:
          RUSTUP_HOME: ${{ runner.temp }}/codex-01592-rustup-home
          CARGO_HOME: ${{ runner.temp }}/codex-01592-rustup-cargo-home
        run: |
          set -euo pipefail
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          rustup toolchain install 1.95.0 --profile minimal
          rustup run 1.95.0 rustc --version | grep -F 'rustc 1.95.0 '
          rustup run 1.95.0 cargo --version | grep -F 'cargo 1.95.0 '

      - name: Vendor public dependencies only (no build or test)
        shell: bash
        env:
          RUSTUP_HOME: ${{ runner.temp }}/codex-01592-rustup-home
          CARGO_HOME: ${{ runner.temp }}/codex-01592-acq/cargo-home
          HOME: ${{ runner.temp }}/codex-01592-acq/temporary-home
        run: |
          set -euo pipefail
          acq="$RUNNER_TEMP/codex-01592-acq"
          mkdir -p "$acq/cargo-home" "$acq/temporary-home/tmp" "$acq/logs" "$acq/output"
          test ! -e "$acq/vendor" || { echo 'STOP: vendor destination exists' >&2; exit 1; }
          cd "$GITHUB_WORKSPACE/upstream/codex-rs"
          if /usr/bin/env -i \
            HOME="$HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            TMPDIR="$acq/temporary-home/tmp" PATH="$PATH" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 CARGO_NET_RETRY=0 \
            CARGO_NET_GIT_FETCH_WITH_CLI=false MALLOC_CONF= \
            rustup run 1.95.0 cargo vendor \
              --locked --versioned-dirs \
              --manifest-path "$GITHUB_WORKSPACE/upstream/codex-rs/Cargo.toml" \
              "$acq/vendor" \
              >"$acq/logs/vendor-config.stdout.toml" \
              2>"$acq/logs/vendor.stderr.log"; then
            echo 'CARGO_VENDOR_EXIT=0'
          else
            vendor_exit=$?
            echo "::error::cargo vendor failed with exit code $vendor_exit"
            echo '::group::Redacted Cargo stderr (last 120 lines)'
            python3 - "$acq/logs/vendor.stderr.log" <<'PY'
          import pathlib
          import re
          import sys
          logfile = pathlib.Path(sys.argv[1])
          lines = logfile.read_text(encoding="utf-8", errors="replace").splitlines()
          print(f"DIAGNOSTIC_LINES_TOTAL={len(lines)}")
          for line in lines[-120:]:
              line = re.sub(r"(?i)(https?://)[^/@\s]+@", r"\1[REDACTED]@", line)
              line = re.sub(r"(?i)\b(authorization|token|password|secret|api_key)\b\s*[:=]\s*\S+", r"\1=[REDACTED]", line)
              print(line[:1000])
          PY
            echo '::endgroup::'
            exit "$vendor_exit"
          fi
          test -d "$acq/vendor"
          test -s "$acq/logs/vendor-config.stdout.toml"
          sha256sum "$GITHUB_WORKSPACE/upstream/codex-rs/Cargo.lock"
          test "$(sha256sum "$GITHUB_WORKSPACE/upstream/codex-rs/Cargo.lock" | cut -d' ' -f1)" = \
            '4fab6fe99180e2b8f305bd4b33c1b4bd825e3fa4cdef1045be750843bd3d431e'
          echo 'VENDOR_COMMAND_EXIT=0; LOCK_UNCHANGED=PASS'

      - name: Package immutable source bundle and summarize size
        shell: bash
        run: |
          set -euo pipefail
          acq="$RUNNER_TEMP/codex-01592-acq"
          bundle="$acq/output/vendor-sources.tar.gz"
          tar -C "$acq" -czf "$bundle" vendor
          cp "$acq/logs/vendor-config.stdout.toml" "$acq/output/vendor-config.stdout.toml"
          printf '%s\n' 'ff6aec96948b70d94983af2641a6b67c94faeff5' > "$acq/output/upstream-commit.txt"
          printf '%s\n' '4fab6fe99180e2b8f305bd4b33c1b4bd825e3fa4cdef1045be750843bd3d431e' > "$acq/output/cargo-lock-sha256.txt"
          (cd "$acq/output" && sha256sum vendor-sources.tar.gz > vendor-sources.tar.gz.sha256)
          bytes="$(stat -c '%s' "$bundle")"
          {
            echo '## Public-only Cargo vendor receipt'
            echo 'Source commit: `ff6aec96948b70d94983af2641a6b67c94faeff5`'
            echo 'Lockfile SHA-256: `4fab6fe99180e2b8f305bd4b33c1b4bd825e3fa4cdef1045be750843bd3d431e`'
            echo "Source bundle bytes: $bytes"
            echo 'Offline build, macOS compatibility, and local runtime: NOT_VERIFIED'
          } >> "$GITHUB_STEP_SUMMARY"
          max_bytes=$((400 * 1024 * 1024))
          if [ "${{ inputs.publish_artifact }}" = 'true' ] && [ "$bytes" -gt "$max_bytes" ]; then
            echo 'STOP: source bundle >400MiB; not eligible for artifact upload' >&2
            exit 1
          fi

      - name: Upload public-only bundle only after explicit opt-in
        if: ${{ inputs.publish_artifact == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-01592-public-vendor-source-only
          path: ${{ runner.temp }}/codex-01592-acq/output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
